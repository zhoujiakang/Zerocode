server:
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: /api
spring:
  profiles:
    default: local
  application:
    name: zerocode-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zerocode?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jackson:
    time-zone: Asia/Shanghai
app:
  ai:
    enabled: ${AI_ENABLED:false}
    code-generation-model: ${AI_CODE_GENERATION_MODEL:code-generation}
    max-messages: 50
    max-tool-calling-round-trips: 10
    models:
      code-generation:
        base-url: ${AI_BASE_URL:}
        model-name: ${AI_MODEL_NAME:}
        api-key: ${AI_API_KEY:}
        timeout: 120s
        max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:16384}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      user: ${REDIS_USER:}
      password: ${REDIS_PASSWORD:}
      key-prefix: "zerocode:agent:memory:"
      ttl-seconds: 604800
      ssl: ${REDIS_SSL:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8123,http://127.0.0.1:8123}
springdoc:
  group-configs:
    - group: default
      packages-to-scan: com.zzz.zerocode.controller
knife4j:
  # 保留 doc.html 文档 UI，关闭 4.5.0 中与 Springdoc 2.8.x 不兼容的增强定制器。
  enable: false

sa-token:
  token-name: zerocode-token
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-cookie: true
  is-read-header: false
  is-read-body: false
  token-style: random-64
  is-log: false
  cookie:
    path: /api
    http-only: true
    same-site: Lax
    secure: ${COOKIE_SECURE:false}

mybatis-plus:
  configuration:
    # 用户表使用 userAccount 等驼峰列名，实体通过 @TableField 显式映射。
    map-underscore-to-camel-case: false
  global-config:
    banner: false
